services:                      # A "service" is one role in your system. Compose makes a container for each.
  db:                          # Service name. Other containers reach this server at hostname "db".
    image: postgres:17         # Image = a read-only template (OS files + Postgres 17). Container = a running instance of it.
    environment:               # Variables passed into the container. The official image reads POSTGRES_*:
      POSTGRES_DB: dormops_db  #   name of the first database it creates
      POSTGRES_USER: postgres  #   the role it creates (this role is a superuser)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? POSTGRES_PASSWORD is not set}
                               #   ${VAR:?msg} = Compose fills in the value from .env, or refuses to start with msg.
    ports:
      - "127.0.0.1:5432:5432"            # HOST_IP:HOST_PORT:CONTAINER_PORT. Opens port 5432 on your Mac's loopback interface and forwards it to Postgres inside.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 2s
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Named volume mounted where Postgres 17 stores its data files.

volumes:
  postgres_data:               # Declares the named volume. Docker manages it, and it outlives the container.
